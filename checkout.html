
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | Dheekshu's Creations</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/responsive.css">

</head>

<body>

<nav class="navbar navbar-light bg-white shadow-sm">

<div class="container">

<a class="navbar-brand brand-logo" href="index.html">
🌸 Dheekshu's Creations
</a>

</div>

</nav>

<div class="container py-5">

<h1 class="section-title text-center mb-5">
Checkout
</h1>

<div class="row">

<div class="col-lg-7">

<div class="checkout-card">

<h3>Customer Details</h3>

<div class="mb-3">
<label>Full Name</label>
<input
type="text"
class="form-control"
id="fullName"
required>
</div>

<div class="mb-3">
<label>Mobile Number</label>
<input
type="text"
class="form-control"
id="mobile"
required>
</div>

<div class="mb-3">
<label>Email (Optional)</label>
<input
type="email"
class="form-control"
id="email">
</div>

<h3 class="mt-4">
Delivery Address
</h3>

<div class="mb-3">
<label>House / Flat No.</label>
<input
type="text"
class="form-control"
id="house"
required>
</div>

<div class="mb-3">
<label>Street</label>
<input
type="text"
class="form-control"
id="street"
required>
</div>

<div class="mb-3">
<label>Area</label>
<input
type="text"
class="form-control"
id="area"
required>
</div>

<div class="row">

<div class="col-md-6">

<div class="mb-3">

<label>City</label>

<input
type="text"
class="form-control"
id="city"
required>

</div>

</div>

<div class="col-md-6">

<div class="mb-3">

<label>State</label>

<input
type="text"
class="form-control"
id="state"
required>

</div>

</div>

</div>

<div class="mb-3">

<label>PIN Code</label>

<input
type="text"
class="form-control"
id="pincode"
required>

</div>

</div>

</div>

<div class="col-lg-5">

<div class="checkout-summary">

<h3>
Order Summary
</h3>

<div id="checkout-items">

</div>

<hr>

<h4>

Total :
<span id="checkout-total">
₹0
</span>

</h4>

<button
class="btn btn-shop w-100"
id="paymentBtn">

Proceed to Online Payment

</button>

</div>

</div>

</div>

</div>

<script src="assets/js/cart.js"></script>
<script src="assets/js/checkout.js"></script>

</body>

</html>
